<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="rms-indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="rms-violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <linearGradient id="rms-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="rms-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="rms-tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181934" />
      <stop offset="100%" stop-color="#0C0D1A" />
    </linearGradient>

    <linearGradient id="rms-tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="rms-badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6366F1" flood-opacity="0.32"/>
    </filter>

    <filter id="rms-star-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>

    <filter id="rms-cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g transform="translate(2, 2)">
    <!-- Base Squircle Card with Border & Shadow -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#rms-tile-bg)" stroke="url(#rms-tile-border)" stroke-width="1.25" filter="url(#rms-badge-glow)"/>

    <!-- Subtle Guide Grid -->
    <path d="M 11 22 H 33 M 22 11 V 33" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="2 2" />

    <!-- 1. The Dynamic "R" Stem -->
    <rect x="11" y="12" width="4.5" height="20" rx="2.25" fill="url(#rms-indigo-grad)"/>

    <!-- The "R" Loop -->
    <path d="M 14.5 14.5 H 22 C 25.8 14.5 28.5 17 28.5 20.25 C 28.5 23.5 25.8 26 22 26 H 14.5" 
          stroke="url(#rms-indigo-grad)" stroke-width="4.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 2. Healthcare & IT Pulse Vector -->
    <path d="M 19 25 L 23 29.5 L 28 21.5 L 33.5 14" 
          stroke="url(#rms-cyan-grad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Pulse Node Point -->
    <circle cx="33.5" cy="14" r="2.2" fill="#38BDF8" filter="url(#rms-cyan-glow)"/>

    <!-- 3. Fluid "S" Ribbon Accent -->
    <path d="M 21.5 32 C 26 32 31 31.5 31 28.5 C 31 25.8 25 25.5 25 22.8 C 25 20.5 28.5 19.8 31 20.8" 
          stroke="url(#rms-violet-grad)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- 4. Premier Star / Diamond Accent -->
    <path d="M 35 6 C 35 7.8 36.3 9 38 9 C 36.3 9 35 10.2 35 12 C 35 10.2 33.7 9 32 9 C 33.7 9 35 7.8 35 6 Z" 
          fill="url(#rms-amber-grad)" filter="url(#rms-star-glow)"/>
  </g>
</svg>
