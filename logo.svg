<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 58" fill="none" width="420" height="58">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="rms-indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="rms-violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <linearGradient id="rms-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="rms-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="rms-tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181934" />
      <stop offset="100%" stop-color="#0C0D1A" />
    </linearGradient>

    <linearGradient id="rms-tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="rms-badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6366F1" flood-opacity="0.32"/>
    </filter>

    <filter id="rms-star-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>

    <filter id="rms-cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- ═══════════ EMBLEM MARK (48x48) ═══════════ -->
  <g transform="translate(2, 5)">
    <!-- Base Squircle Card with Border & Shadow -->
    <rect x="0" y="0" width="48" height="48" rx="13" fill="url(#rms-tile-bg)" stroke="url(#rms-tile-border)" stroke-width="1.25" filter="url(#rms-badge-glow)"/>

    <!-- Subtle Guide Grid -->
    <path d="M 12 24 H 36 M 24 12 V 36" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="2 2" />

    <!-- 1. The Dynamic "R" Stem -->
    <rect x="12" y="13.5" width="4.75" height="22" rx="2.375" fill="url(#rms-indigo-grad)"/>

    <!-- The "R" Loop -->
    <path d="M 15.5 16 H 24 C 28.2 16 31 18.5 31 22 C 31 25.5 28.2 28 24 28 H 15.5" 
          stroke="url(#rms-indigo-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 2. Healthcare & IT Pulse Vector (Center to Top Right) -->
    <path d="M 21 27 L 25 31.5 L 30 23.5 L 36 15.5" 
          stroke="url(#rms-cyan-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Pulse Node Point (IT network milestone) -->
    <circle cx="36" cy="15.5" r="2.3" fill="#38BDF8" filter="url(#rms-cyan-glow)"/>

    <!-- 3. Fluid "S" Ribbon Accent -->
    <path d="M 23.5 34.5 C 28 34.5 33.5 34 33.5 30.5 C 33.5 27.5 27 27.5 27 24.5 C 27 22 31 21.2 33.5 22.2" 
          stroke="url(#rms-violet-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- 4. Premier Star / Diamond Accent (Amber / Gold) -->
    <path d="M 38.5 7 C 38.5 9 40 10.2 41.8 10.2 C 40 10.2 38.5 11.5 38.5 13.5 C 38.5 11.5 37 10.2 35.2 10.2 C 37 10.2 38.5 9 38.5 7 Z" 
          fill="url(#rms-amber-grad)" filter="url(#rms-star-glow)"/>
  </g>

  <!-- ═══════════ TYPOGRAPHY / WORDMARK (Stretched & Maximum Readability) ═══════════ -->
  <g transform="translate(64, 0)">
    <!-- Primary Name: RMS Premier + Amber Dot -->
    <text x="0" y="29" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="-0.02em">
      <tspan fill="#FFFFFF">RMS</tspan><tspan fill="url(#rms-indigo-grad)" font-weight="700">Premier</tspan><tspan fill="url(#rms-amber-grad)" font-size="28" font-weight="900">.</tspan>
    </text>

    <!-- Subtitle: SERVICES | HEALTHCARE & IT PM (15px Ultra-Legible, Bold & High Contrast) -->
    <text x="0.5" y="49" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" letter-spacing="0.05em">
      <tspan fill="#FFFFFF">SERVICES</tspan> <tspan fill="#818CF8" font-weight="600">|</tspan> <tspan fill="#E2E8F0" font-weight="800">HEALTHCARE &amp; IT PM</tspan>
    </text>
  </g>
</svg>